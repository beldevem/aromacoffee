<footer class="site-footer">
  <div class="footer-brand">
    <img src="/brand/aroma-logo.svg" [attr.alt]="i18n.t('brand.alt')" />
    <p>{{ i18n.t('footer.tagline') }}</p>
  </div>
  <div class="footer-links">
    <a routerLink="/menu">{{ i18n.t('nav.menu') }}</a>
    <a routerLink="/visit">{{ i18n.t('nav.visit') }}</a>
    <a href="tel:+21600000000">{{ i18n.t('footer.call') }}</a>
  </div>
  <div class="social-links" [attr.aria-label]="i18n.t('social.label')">
    <a
      class="social-link"
      href="https://www.facebook.com/aroma.coffee77/"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="i18n.t('social.facebook')"
      [attr.title]="i18n.t('social.facebook')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3c-3.3 0-5 1.9-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1Z" /></svg>
    </a>
    <a
      class="social-link"
      href="https://www.instagram.com/aromaacoffeeshopp/"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="i18n.t('social.instagram')"
      [attr.title]="i18n.t('social.instagram')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.5" cy="6.5" r="1" class="social-dot" /></svg>
    </a>
  </div>
  <small>{{ i18n.t('footer.copyright') }}</small>
</footer>
