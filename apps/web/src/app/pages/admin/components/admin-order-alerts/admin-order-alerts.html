<div class="order-alerts" role="status" aria-live="polite">
  @for (order of alerts.notifications(); track order.id) {
    <article class="order-alert">
      <div class="alert-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6 2h12l2 5H4z"/><path d="M5 7v13a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7"/></svg>
      </div>
      <div class="alert-body">
        <strong>{{ i18n.t('admin.alerts.newOrder') }} · {{ order.table.label }}</strong>
        <small>{{ summarise(order) }}</small>
        <span class="alert-total">{{ formatPrice(order.totalCents) }} · {{ order.reference }}</span>
        <a routerLink="/admin/orders" (click)="alerts.dismiss(order.id)">{{ i18n.t('admin.alerts.view') }}</a>
      </div>
      <button type="button" class="alert-close" [attr.aria-label]="i18n.t('admin.alerts.dismiss')" (click)="alerts.dismiss(order.id)">&#10005;</button>
    </article>
  }
</div>
