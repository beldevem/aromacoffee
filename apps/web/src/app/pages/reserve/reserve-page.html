<app-site-header />

<main class="page-shell">
  <p class="eyebrow">{{ i18n.t('reserve.page.eyebrow') }}</p>
  <h1>{{ i18n.t('reserve.page.title') }}</h1>
  <p class="page-intro">{{ i18n.t('reserve.page.copy') }}</p>
  <form class="reservation-form" (ngSubmit)="submit()" #reservationForm="ngForm">
    <div class="form-grid">
        <label>{{ i18n.t('reserve.form.name') }} <span class="required-mark" aria-hidden="true">*</span><input name="customerName" [(ngModel)]="draft.customerName" required minlength="2" maxlength="80" #customerName="ngModel" />@if (customerName.invalid && (customerName.touched || reservationForm.submitted)) { <small class="field-error">{{ customerName.errors?.['required'] ? i18n.t('validation.required') : i18n.t('validation.name') }}</small> }</label>
        <label>{{ i18n.t('reserve.form.phone') }} <span class="required-mark" aria-hidden="true">*</span><span class="phone-field"><span class="country-code">+216</span><input name="contactPhone" type="tel" inputmode="numeric" pattern="[24579][0-9]{7}" maxlength="8" placeholder="20 123 456" [(ngModel)]="draft.contactPhone" required #contactPhone="ngModel" /></span>@if (contactPhone.invalid && (contactPhone.touched || reservationForm.submitted)) { <small class="field-error">{{ contactPhone.errors?.['required'] ? i18n.t('validation.required') : i18n.t('validation.phone') }}</small> }</label>
      <label>{{ i18n.t('reserve.form.email') }}<input name="contactEmail" type="email" maxlength="120" [(ngModel)]="draft.contactEmail" #contactEmail="ngModel" />@if (contactEmail.invalid && contactEmail.touched) { <small class="field-error">{{ i18n.t('validation.email') }}</small> }</label>
        <label>{{ i18n.t('reserve.form.date') }} <span class="required-mark" aria-hidden="true">*</span><input name="dateTime" type="datetime-local" [min]="minDateTime()" [(ngModel)]="draft.dateTime" required #dateTime="ngModel" />@if (dateTime.invalid && (dateTime.touched || reservationForm.submitted)) { <small class="field-error">{{ i18n.t('validation.required') }}</small> }</label>
        <label>{{ i18n.t('reserve.form.guests') }} <span class="required-mark" aria-hidden="true">*</span><input name="partySize" type="number" min="1" max="20" [(ngModel)]="draft.partySize" required #partySize="ngModel" />@if (partySize.invalid && (partySize.touched || reservationForm.submitted)) { <small class="field-error">{{ i18n.t('validation.guests') }}</small> }</label>
        <label>{{ i18n.t('reserve.form.location') }} <span class="required-mark" aria-hidden="true">*</span><select name="location" [(ngModel)]="draft.location" required><option value="INDOOR">{{ i18n.t('reserve.location.indoor') }}</option><option value="OUTDOOR_TERRACE">{{ i18n.t('reserve.location.terrace') }}</option><option value="N/A">{{ i18n.t('reserve.location.na') }}</option></select></label>
    </div>
    <label>{{ i18n.t('reserve.form.notes') }}<textarea name="notes" rows="4" [(ngModel)]="draft.notes"></textarea></label>
    @if (error()) { <p class="form-message error">{{ error() }}</p> }
    @if (submitted()) { <p class="form-message success">{{ i18n.t('reserve.form.success') }}</p> }
    <button class="submit-button" type="submit" [disabled]="reservationForm.invalid || submitting()">{{ submitting() ? i18n.t('reserve.form.sending') : i18n.t('reserve.form.submit') }}</button>
  </form>
</main>

<app-site-footer />
