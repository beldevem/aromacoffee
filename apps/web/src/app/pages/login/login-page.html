<main class="login-page"><section class="login-panel"><img src="/brand/aroma-logo.svg" alt="Aroma Coffee Shop" /><p class="eyebrow">{{ i18n.t('auth.kicker') }}</p><h1>{{ i18n.t('auth.title') }}</h1><p>{{ i18n.t('auth.copy') }}</p><form (ngSubmit)="submit()" #loginForm="ngForm"><label>{{ i18n.t('auth.email') }}<input name="email" type="email" [(ngModel)]="email" required email /></label><label>{{ i18n.t('auth.password') }}<input name="password" type="password" [(ngModel)]="password" required minlength="8" /></label>@if (error()) { <p class="error">{{ error() }}</p> }<button type="submit" [disabled]="loginForm.invalid || loading()">{{ loading() ? i18n.t('auth.loading') : i18n.t('auth.submit') }}</button></form></section></main>
